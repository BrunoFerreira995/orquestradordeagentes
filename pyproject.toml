[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6.0,<7", "rich>=13.7,<14"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

